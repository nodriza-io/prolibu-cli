<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- An internal tool: keep it out of search engines and do not leak its URL to other sites. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Prolibu Site</title>
    <!-- Cobalt, Prolibu's design system, served by the account itself (same version as the app). -->
    <link rel="stylesheet" href="/ui/static/cobalt/tokens/tokens.css">
    <script type="module" src="/ui/static/cobalt/cobalt/cobalt.esm.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Prolibu Site</h1>
            <p id="who" class="muted">Checking your session…</p>
        </div>
        <co-button id="signout" variant="stroke" shape="square" hidden>Sign out</co-button>
    </header>

    <main class="main">
        <co-card variant="outlined" padding="sm">
            <h2>Latest deals</h2>
            <co-skeleton id="loading"></co-skeleton>
            <div id="deals"></div>
            <co-empty-state id="empty" heading="No deals yet" description="Deals you can see will show up here." icon="briefcase" variant="plain" hidden></co-empty-state>
            <co-helper-text id="error" status="error" hidden></co-helper-text>
        </co-card>
        <p class="muted">Edit <code>public/index.html</code>, <code>public/styles.css</code> and <code>public/script.js</code> to build your site.</p>
    </main>

    <!-- Reads the app's session (localStorage.apiKey on this same origin) and calls /v2. -->
    <script src="prolibu-session.js"></script>
    <script src="script.js"></script>
</body>
</html>
