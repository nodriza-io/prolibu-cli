<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extended quote</title>
  <!-- Cobalt, Prolibu's design system, served by the account itself (same version as the app). -->
  <link rel="stylesheet" href="/ui/static/cobalt/tokens/tokens.css">
  <script type="module" src="/ui/static/cobalt/cobalt/cobalt.esm.js"></script>
  <style>
    /* Layout only: every color, space and radius comes from a --co-* token. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; } /* co-* set display on :host, which beats the hidden attribute */
    body { margin: 0; padding: var(--co-spacing-lg); font-family: var(--co-font-family-primary); color: var(--co-semantic-text-default); background: var(--co-semantic-surface-page); }
    h1 { font-size: var(--co-font-size-16); margin: 0 0 var(--co-spacing-xs); }
    h2 { font-size: var(--co-font-size-14); margin: var(--co-spacing-lg) 0 var(--co-spacing-xs); }
    .muted { color: var(--co-semantic-text-muted); }
    #term { display: block; margin: var(--co-spacing-md) 0 var(--co-spacing-sm); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; gap: var(--co-spacing-sm); align-items: center; padding: var(--co-spacing-sm) 0; border-bottom: 1px solid var(--co-semantic-border-subtle); }
    li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li co-number-field { width: 96px; }
    footer { position: sticky; bottom: 0; display: flex; gap: var(--co-spacing-sm); justify-content: flex-end; padding-top: var(--co-spacing-md); background: var(--co-semantic-surface-page); }
  </style>
</head>
<body>
  <h1 id="title">Loading deal…</h1>
  <div id="meta" class="muted"></div>

  <co-date-field id="day" label="Event day" hidden></co-date-field>
  <co-input id="term" type="search" icon-left="magnifying-glass" placeholder="Search a product by name or code (2 letters or more)" disabled></co-input>
  <co-helper-text id="status"></co-helper-text>
  <ul id="results"></ul>

  <h2>To add to the quote</h2>
  <ul id="picked"></ul>

  <footer>
    <co-button id="cancel" variant="secondary" shape="square" size="m" label="Cancel"></co-button>
    <co-button id="apply" variant="primary" shape="square" size="m" label="Apply to the quote" disabled></co-button>
  </footer>

  <!-- In the package, prolibu-extended-quote.js sits NEXT TO this index.html (copy it from the skill's assets). -->
  <script src="./prolibu-extended-quote.js"></script>
  <script>
    const $ = (id) => document.getElementById(id)
    const host = ProlibuQuote.connect()
    const picked = [] // REAL lines returned by lineItemFromEntry
    let currency = null
    let isEvents = false
    // Events lines are stamped in the user's time zone. The profile's comes from the API; when it is
    // empty the account's applies, which only admins can read: set ACCOUNT_TIME_ZONE for this site.
    const ACCOUNT_TIME_ZONE = 'America/Bogota'
    let timeZone = null
    let searchTimer = null
    let searchController = null

    function setStatus (text, isError = false) {
      $('status').message = text
      $('status').status = isError ? 'error' : 'default'
    }

    function el (tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props)
      node.append(...children)
      return node
    }

    // Opened outside the editor (a review, a direct link): show the catalog, never apply.
    if (!host.embedded) {
      $('title').textContent = 'Catalog preview'
      $('meta').textContent = 'Open it from the quote editor to add products to a quote.'
      $('term').disabled = false
    }

    // 1) First message AS SOON AS the page loads: the editor's modal errors out if we stay silent for 15 s.
    if (host.embedded) host.getDeal().then((deal) => {
      const quote = host.quote()
      currency = quote.quoteCurrency || null
      isEvents = quote.quoteMode === 'Events'
      $('day').hidden = !isEvents
      if (isEvents) ProlibuQuote.userTimeZone().then((tz) => { timeZone = tz || ACCOUNT_TIME_ZONE }).catch(() => { timeZone = ACCOUNT_TIME_ZONE })
      $('title').textContent = deal.dealName || 'New deal'
      $('meta').textContent = `${quote.lineItems.length} line(s) in the quote · currency ${currency || 'not set'}`
      $('term').disabled = false
      $('term').setFocus?.()
    }).catch((err) => setStatus(err.message, true))

    // 2) Search with the editor's endpoint (debounced, and the previous request is cancelled).
    // Cobalt events are camelCase CustomEvents: coInput carries the text in event.detail.
    $('term').addEventListener('coInput', (event) => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(() => search(event.detail || ''), 300)
    })

    async function search (term) {
      searchController?.abort()
      searchController = new AbortController()
      $('results').replaceChildren()
      if (term.trim().length < 2) return setStatus('')
      setStatus('Searching…')
      try {
        const { items, total } = await ProlibuQuote.searchProducts(term, { currency, signal: searchController.signal })
        setStatus(items.length ? `${items.length} result(s) from ${total} product(s)` : 'No results in the quote currency')
        $('results').replaceChildren(...items.map(resultRow))
      } catch (err) {
        if (err.name === 'AbortError') return
        setStatus(err.code === 'TOO_MANY' ? 'Too many results: type more letters.' : err.message, true)
      }
    }

    function resultRow (item) {
      const qty = el('co-number-field', { min: 1, value: 1, size: 'sm' })
      const add = el('co-button', { label: 'Add', variant: 'soft', shape: 'square', size: 's' })
      add.addEventListener('click', async () => {
        if (isEvents && !$('day').value) return setStatus('Pick the event day before adding.', true)
        add.disabled = true
        try {
          // 3) The SERVER builds the line: pricebookEntry, product, pricebook, taxes, lineId.
          //    In an events quote each line carries the dates of its day.
          const overrides = { quantity: Math.max(1, Number(qty.value) || 1) }
          if (isEvents) Object.assign(overrides, ProlibuQuote.eventDay($('day').value, timeZone || ACCOUNT_TIME_ZONE))
          const line = await ProlibuQuote.lineItemFromEntry(item.entryId, overrides)
          picked.push(line)
          renderPicked()
        } catch (err) {
          setStatus(err.message, true)
        } finally {
          add.disabled = false
        }
      })
      const label = `${item.productName} · ${item.productCode || ''} · ${item.price} ${item.currency} · ${item.pricebookName}`
      return el('li', {}, [el('span', { className: 'name', textContent: label, title: label }), qty, add])
    }

    function renderPicked () {
      $('picked').replaceChildren(...picked.map((line, index) => {
        const remove = el('co-button', { label: 'Remove', variant: 'ghost', shape: 'square', size: 's' })
        remove.addEventListener('click', () => { picked.splice(index, 1); renderPicked() })
        return el('li', {}, [el('span', { className: 'name', textContent: `${line.quantity} × ${line.productName}` }), remove])
      }))
      $('apply').disabled = picked.length === 0
    }

    // 4) Apply = the FULL list (what was there + the new lines). The host replaces, it does not add.
    $('apply').addEventListener('click', () => {
      try {
        host.applyLineItems([...host.quote().lineItems, ...picked])
        host.close()
      } catch (err) {
        setStatus(err.message, true)
      }
    })
    $('cancel').addEventListener('click', () => host.close())
  </script>
</body>
</html>
